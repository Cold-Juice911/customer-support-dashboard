<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A focused customer support workspace. Search, prioritize, and resolve tickets in one place."
    />
    <meta name="theme-color" content="#375DFB" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Customer Support Dashboard</title>
    <script>
      try {
        const theme = localStorage.getItem('support-theme');
        document.documentElement.classList.toggle(
          'dark',
          theme === 'dark' ||
            (theme !== 'light' &&
              matchMedia('(prefers-color-scheme: dark)').matches),
        );
      } catch {
        document.documentElement.classList.toggle(
          'dark',
          matchMedia('(prefers-color-scheme: dark)').matches,
        );
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
